[pytest]
pythonpath = .
testpaths = tests
addopts = -v --html=reports/reporte.html --self-contained-html
# --- Log a archivo (siempre) ---
log_file = logs/ejecucion.log
log_file_level = INFO
log_file_mode = w
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
# --- Log en consola (apagado por defecto; activar con: pytest -o log_cli=true) ---
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
