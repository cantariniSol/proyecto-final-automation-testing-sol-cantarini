name: Tests automatizados

# Cuándo se ejecuta
on:
  push:                 # en cada push, a cualquier rama
  pull_request:
    branches: [main]
  workflow_dispatch:    # botón "Run workflow" para ejecutarlo a mano

jobs:
  tests:
    runs-on: ubuntu-latest   # máquina Linux de GitHub (ya trae Google Chrome instalado)

    env:
      HEADLESS: "true"       # Chrome sin ventana
      PAUSA_VISUAL: "0"      # sin pausas entre clics

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip         # reutiliza las dependencias entre ejecuciones (más rápido)

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests (UI + API)
        run: pytest

      - name: Subir reporte, logs y capturas como artefactos
        if: always()         # se suben aunque fallen los tests (justo cuando más se necesitan)
        uses: actions/upload-artifact@v5
        with:
          name: resultados-tests-${{ github.run_number }}
          path: |
            reports/
            logs/
            screenshots/
          retention-days: 30